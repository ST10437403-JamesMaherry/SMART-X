server {
    listen 8080;
    listen [::]:8080;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The Smart-X API enforces a 10 MiB attachment limit itself.
    #
    # A slightly larger proxy limit leaves sufficient space for multipart
    # boundaries and request metadata while keeping the application-level
    # limit authoritative.
    client_max_body_size 12m;

    # Conservative browser-facing security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Lightweight container health endpoint for the frontend service.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ---------------------------------------------------------------------
    # Smart-X HTTP API
    # ---------------------------------------------------------------------
    #
    # Requests remain on the same browser origin while Nginx forwards them
    # through Docker's private network to the API service.
    #
    # Request and response buffering are disabled because Smart-X deliberately
    # streams attachment uploads and downloads rather than buffering complete
    # files in memory or at the proxy boundary.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # SignalR
    # ---------------------------------------------------------------------
    #
    # The Adaptive Anomaly Spotlight uses this endpoint for lightweight
    # invalidation notifications. WebSocket upgrade headers must be preserved
    # by the reverse proxy.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # React single-page application
    # ---------------------------------------------------------------------
    #
    # Direct navigation to routes such as /ingestion must return index.html so
    # React Router can perform client-side route resolution.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
