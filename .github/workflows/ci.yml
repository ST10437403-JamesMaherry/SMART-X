name: CI

# Validate all changes entering the integration or release branches.
on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  # Allow maintainers to run the workflow manually when required.
  workflow_dispatch:

# The workflow only needs permission to read repository content.
permissions:
  contents: read

# Cancel an outdated run when newer commits are pushed to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # BACKEND
  # ===========================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and audit NuGet dependencies
        run: >
          dotnet restore SmartX.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:"NU1901;NU1902;NU1903;NU1904"

      - name: Check .NET formatting
        run: dotnet format SmartX.sln --verify-no-changes --no-restore

      - name: Build solution
        run: >
          dotnet build SmartX.sln
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test SmartX.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

  # ===========================================================================
  # FRONTEND
  # ===========================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/SmartX.Client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/SmartX.Client/package-lock.json

      # npm ci performs a reproducible installation from package-lock.json.
      - name: Restore frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build React client
        run: npm run build

  # ===========================================================================
  # BROWSER REGRESSION
  # ===========================================================================
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Do not spend CI time starting browsers until both application layers have
    # independently passed their normal quality gates.
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/SmartX.Client/package-lock.json

      - name: Restore frontend dependencies
        working-directory: src/SmartX.Client
        run: npm ci

      # Install only Chromium because the browser regression suite requires browser
      # regression coverage rather than a full cross-browser compatibility lab.
      - name: Install Playwright Chromium
        working-directory: src/SmartX.Client
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts both the ASP.NET API and the Vite client
      # using isolated test configuration.
      - name: Run Playwright regression suite
        working-directory: src/SmartX.Client
        run: npm run test:e2e

  # ===========================================================================
  # PRODUCTION CONTAINER DEPLOYMENT
  # ===========================================================================
  docker:
    name: Docker Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Container validation is a final delivery gate. There is no value spending
    # runner time building deployment images until the source-level backend,
    # frontend and browser regression suites have all passed.
    needs:
      - backend
      - frontend
      - e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Local Compose generates its own random key inside a dedicated volume;
      # CI only overrides the host-facing port to avoid runner conflicts.
      - name: Configure CI local port
        run: echo "SMARTX_HTTP_PORT=18080" >> "$GITHUB_ENV"

      # Validate variable substitution and Compose syntax before performing the
      # substantially more expensive container image builds.
      #
      # --quiet avoids printing the full deployment configuration in CI logs.
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      # Build both final production images through the same Compose definition
      # used for local deployment.
      - name: Build Smart-X production images
        run: docker compose build

      # -----------------------------------------------------------------------
      # Runtime privilege validation
      # -----------------------------------------------------------------------
      #
      # Smart-X containers should not execute their application processes as
      # root. This check fails if either image loses its non-root runtime user
      # during a future Dockerfile change.
      - name: Verify non-root runtime users
        shell: bash
        run: |
          api_user="$(docker image inspect smartx-api:local --format '{{.Config.User}}')"
          client_user="$(docker image inspect smartx-client:local --format '{{.Config.User}}')"

          echo "API runtime user: ${api_user}"
          echo "Client runtime user: ${client_user}"

          if [[ -z "${api_user}" || "${api_user}" == "0" || "${api_user}" == "root" ]]; then
            echo "Smart-X API image is not configured with a non-root runtime user."
            exit 1
          fi

          if [[ -z "${client_user}" || "${client_user}" == "0" || "${client_user}" == "root" ]]; then
            echo "Smart-X client image is not configured with a non-root runtime user."
            exit 1
          fi

      # Start the same two-service production topology used by the documented
      # local Docker deployment.
      #
      # The client service is already configured to wait for the API's real
      # /api/health Docker health check before starting.
      - name: Start Smart-X container deployment
        run: docker compose up --detach

      # Do not rely on an arbitrary sleep duration. Poll the externally visible
      # application boundary until Nginx and the proxied ASP.NET Core API both
      # answer successfully or the bounded readiness period expires.
      - name: Wait for Smart-X readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if \
              curl --fail --silent --show-error \
                "http://127.0.0.1:${SMARTX_HTTP_PORT}/healthz" \
                > /dev/null \
              && \
              curl --fail --silent --show-error \
                "http://127.0.0.1:${SMARTX_HTTP_PORT}/api/health" \
                > /dev/null
            then
              echo "Smart-X Docker deployment is ready."
              exit 0
            fi

            echo "Waiting for Smart-X containers (${attempt}/30)..."
            sleep 2
          done

          echo "Smart-X did not become ready within the expected period."
          docker compose ps
          exit 1

      # Docker health checks execute independently from the host-side readiness
      # requests above. Nginx may already accept HTTP traffic while Docker
      # still reports its health state as "starting".
      #
      # Polling removes that race condition and also gives the client enough
      # time to complete its first scheduled container health check.
      - name: Verify container health
        shell: bash
        run: |
          api_container="$(docker compose ps --quiet api)"
          client_container="$(docker compose ps --quiet client)"

          if [[ -z "${api_container}" || -z "${client_container}" ]]; then
            echo "One or more Smart-X containers could not be resolved."
            docker compose ps
            exit 1
          fi

          for attempt in {1..30}; do
            api_health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "${api_container}"
            )"

            client_health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "${client_container}"
            )"

            echo "Health check ${attempt}/30:"
            echo "  API:    ${api_health}"
            echo "  Client: ${client_health}"

            if [[ "${api_health}" == "healthy" && "${client_health}" == "healthy" ]]; then
              echo "Both Smart-X containers are healthy."
              exit 0
            fi

            # An explicitly unhealthy container is a real failure rather than
            # a startup race, so surface it immediately.
            if [[ "${api_health}" == "unhealthy" || "${client_health}" == "unhealthy" ]]; then
              echo "A Smart-X container entered an unhealthy state."
              docker compose ps
              docker compose logs --no-color --tail=100
              exit 1
            fi

            sleep 2
          done

          echo "Smart-X containers did not become healthy within 60 seconds."
          docker compose ps
          docker compose logs --no-color --tail=100
          exit 1

      # Confirm the running containers use their configured non-root identities.
      # Checking only image metadata is not sufficient if Compose overrides the
      # runtime user; this executes `id -u` in each actual healthy container.
      - name: Verify live container processes are non-root
        shell: bash
        run: |
          api_uid="$(docker compose exec -T api id -u | tr -d '\r')"
          client_uid="$(docker compose exec -T client id -u | tr -d '\r')"

          for entry in "api:${api_uid}" "client:${client_uid}"; do
            service="${entry%%:*}"
            uid="${entry#*:}"
            if [[ ! "${uid}" =~ ^[1-9][0-9]*$ ]]; then
              echo "${service} is not running with a verified non-root UID."
              exit 1
            fi
            echo "${service} container UID is non-root: ${uid}"
          done

      # -----------------------------------------------------------------------
      # Production routing smoke tests
      # -----------------------------------------------------------------------

      # Verify that the compiled React application is actually being served by
      # the production Nginx container.
      - name: Verify production React endpoint
        run: >
          curl
          --fail
          --silent
          --show-error
          "http://127.0.0.1:${SMARTX_HTTP_PORT}/"
          > /dev/null

      # This request passes through:
      #
      # host -> Nginx -> private Docker network -> ASP.NET Core
      #
      # and therefore proves the production API reverse-proxy path works.
      - name: Verify API reverse proxy
        run: >
          curl
          --fail
          --silent
          --show-error
          "http://127.0.0.1:${SMARTX_HTTP_PORT}/api/health"

      # P2-11: Exercise the actual browser-facing Nginx boundary, not an
      # internal container URL. Validates direct /realtime navigation, real
      # Part 2 snapshot/condition/prediction DTOs, worker startup, and both
      # SignalR negotiate + WebSocket upgrade paths. No telemetry is submitted
      # and no secrets or connection tokens are printed to workflow logs.
      - name: Verify Part 2 routing and real-time boundaries
        run: >
          python3 scripts/verify_part2_docker_boundaries.py
          --base-url "http://127.0.0.1:${SMARTX_HTTP_PORT}"
          --timeout-seconds 8

      # Adaptive Anomaly Spotlight uses SignalR. Normal HTTP health checks alone
      # would not prove that the /hubs reverse proxy is correctly configured.
      - name: Verify SignalR reverse proxy
        shell: bash
        run: |
          response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              "http://127.0.0.1:${SMARTX_HTTP_PORT}/hubs/dashboard/negotiate?negotiateVersion=1"
          )"

          if ! grep --quiet '"availableTransports"' <<< "${response}"; then
            echo "SignalR negotiation did not return available transports."
            exit 1
          fi

          echo "SignalR negotiation succeeded."

      # The API may expose port 8080 to other containers on the private
      # Compose network, but it must never publish that port to the host.
      #
      # Do not use `docker compose port` for this assertion. Some Docker
      # Compose versions represent an exposed-but-unpublished port as ":0",
      # which produces a false positive.
      #
      # HostConfig.PortBindings is Docker's authoritative configuration for
      # host port publication.
      - name: Verify API remains private
        shell: bash
        run: |
          api_container="$(docker compose ps --quiet api)"

          if [[ -z "${api_container}" ]]; then
            echo "Smart-X API container could not be resolved."
            docker compose ps
            exit 1
          fi

          published_binding="$(
            docker inspect \
              --format '{{with (index .HostConfig.PortBindings "8080/tcp")}}{{json .}}{{end}}' \
              "${api_container}"
          )"

          if [[ -n "${published_binding}" && "${published_binding}" != "null" ]]; then
            echo "API container unexpectedly publishes port 8080 to the host:"
            echo "${published_binding}"
            exit 1
          fi

          echo "API port 8080 is available only inside the Docker network."

      # Display the final service state as useful CI evidence.
      - name: Display Docker service state
        run: docker compose ps

      # If any earlier Docker step fails, surface recent logs before cleanup so
      # startup, health-check, permission and reverse-proxy failures are easy to
      # diagnose from the GitHub Actions run.
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      # Always remove CI containers, the private network and the disposable
      # encrypted attachment volume.
      #
      # This runs even when a previous Docker validation step fails.
      - name: Clean up Docker deployment
        if: always()
        run: docker compose down --volumes --remove-orphans
