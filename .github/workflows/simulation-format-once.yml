name: One-shot Simulation Lab Prettier
on:
  push:
    branches:
      - feat/simulation-dashboard
    paths:
      - .github/workflows/simulation-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/simulation-dashboard
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/SmartX.Client/package-lock.json
      - name: Install locked formatter
        run: npm ci
        working-directory: src/SmartX.Client
      - name: Format only the Simulation Lab changes
        working-directory: src/SmartX.Client
        run: |
          npx prettier --write \
            e2e/simulation-dashboard.spec.ts \
            src/App.css \
            src/features/simulation/scenarios.ts \
            src/pages/GatewayHomePage.tsx \
            src/pages/SimulationPage.css \
            src/pages/SimulationPage.tsx
      - name: Commit formatted content and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartX.Client/e2e/simulation-dashboard.spec.ts \
            src/SmartX.Client/src/App.css \
            src/SmartX.Client/src/features/simulation/scenarios.ts \
            src/SmartX.Client/src/pages/GatewayHomePage.tsx \
            src/SmartX.Client/src/pages/SimulationPage.css \
            src/SmartX.Client/src/pages/SimulationPage.tsx
          git rm .github/workflows/simulation-format-once.yml
          git commit -m "style: apply Prettier to Simulation Lab UI"
          git push origin HEAD:feat/simulation-dashboard
